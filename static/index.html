<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rights & Clearance Scout</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --border: #262c38;
    --text: #e8eaf0;
    --muted: #8a8f9c;
    --accent: #d4af37;
    --clear: #3ecf8e;
    --flag: #f0b429;
    --escalate: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  textarea {
    width: 100%;
    min-height: 220px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 14px;
    font-family: ui-monospace, monospace;
    font-size: 0.9rem;
    resize: vertical;
  }
  button {
    margin-top: 14px;
    background: var(--accent);
    color: #14161c;
    border: none;
    border-radius: 6px;
    padding: 12px 22px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { color: var(--muted); margin-top: 10px; font-size: 0.9rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 8px;
    padding: 16px 18px;
    margin-top: 14px;
  }
  .card.clear { border-left-color: var(--clear); }
  .card.flag { border-left-color: var(--flag); }
  .card.escalate { border-left-color: var(--escalate); }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge.clear { background: rgba(62,207,142,0.15); color: var(--clear); }
  .badge.flag { background: rgba(240,180,41,0.15); color: var(--flag); }
  .badge.escalate { background: rgba(229,72,77,0.15); color: var(--escalate); }
  .card p { margin: 6px 0; color: #c7cad2; font-size: 0.92rem; }
  .card .action { color: var(--accent); font-weight: 600; }
  .card .sources { margin-top: 8px; font-size: 0.8rem; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
  <h1>Rights &amp; <span>Clearance</span> Scout</h1>
  <p class="sub">Paste a script excerpt or shot list. The agent extracts every song, brand, real person, trademark, and location, researches each live on the web via Parallel, and returns a cited clearance-risk verdict.</p>

  <textarea id="script" placeholder="Paste script or shot-list text here..."></textarea>
  <br />
  <button id="scanBtn">Scan for clearance risk</button>
  <div id="status"></div>
  <div id="results"></div>

<script>
const scanBtn = document.getElementById('scanBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

scanBtn.addEventListener('click', async () => {
  const text = document.getElementById('script').value.trim();
  if (!text) { statusEl.textContent = 'Paste some script text first.'; return; }

  scanBtn.disabled = true;
  statusEl.textContent = 'Extracting entities and researching each one via Parallel... this can take a minute.';
  resultsEl.innerHTML = '';

  try {
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ script_text: text })
    });
    const data = await res.json();
    statusEl.textContent = `Done — ${data.report.length} entities scanned.`;

    for (const r of data.report) {
      const card = document.createElement('div');
      card.className = `card ${r.risk_level}`;
      card.innerHTML = `
        <h3>${r.entity_name} <span class="badge ${r.risk_level}">${r.risk_level}</span></h3>
        <p><strong>${r.entity_type}</strong> — ${r.reasoning}</p>
        <p class="action">Recommended: ${r.recommended_action}</p>
        ${r.sources.length ? `<div class="sources">Sources: ${r.sources.join(' · ')}</div>` : ''}
      `;
      resultsEl.appendChild(card);
    }
  } catch (e) {
    statusEl.textContent = 'Error running scan: ' + e.message;
  } finally {
    scanBtn.disabled = false;
  }
});
</script>
</body>
</html>
